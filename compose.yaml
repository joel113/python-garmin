services:
  app:
    build: .
    image: python-garmin:local
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${APP_PORT:-8001}:8000"
    environment:
      GARMIN_DB_PATH: /data/activities.sqlite3
      GARMIN_ALLOWED_HOSTS: "localhost:${APP_PORT:-8001},127.0.0.1:${APP_PORT:-8001}"
      GARMIN_API_KEY: "${GARMIN_API_KEY:-}"
    volumes:
      - ./activities:/app/activities
      - ./analysis:/app/analysis
      - ./storage:/data
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 5
