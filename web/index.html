<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garmin Activity Library</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="/style.css"></head>
<body><nav class="sidebar" aria-label="Main navigation"><div class="brand">Garmin<span>Activity Library</span></div><button data-view="summary" aria-current="page">Summary</button><button data-view="heat">Heatmap</button><button data-view="tracks">Single tracks</button></nav>
<main><p id="error" role="alert" hidden></p>
<section id="summary" class="view"><header><h1>Summary</h1><p id="date-range" class="muted">Loading activities…</p></header><div id="cards" class="cards"></div><div class="panels"><article class="panel"><h2>Activities by sport</h2><div id="sports"></div></article><article class="panel"><h2>Recent activities</h2><div id="recent"></div></article></div></section>
<section id="heat" class="view map-view" hidden><header><div><h1>Heatmap</h1><p id="heat-description" class="muted">All routes together. Brighter paths show repeated visits.</p></div><div class="map-controls"><label>Sport<select id="sport-filter"><option value="all">All sports</option></select></label><label>Display mode<select id="heat-mode"><option value="density">Overlapping routes</option><option value="individual">Individual tracks</option></select></label><label>Route color<input id="heat-color" type="color" value="#087e8b"></label></div></header><p id="heat-status" class="status" role="status"></p><div id="heatmap" class="map" aria-label="All activity routes"></div></section>
<section id="tracks" class="view map-view" hidden><header><h1>Single tracks</h1></header><div class="track-layout"><aside class="activity-list"><label class="search">Search activities<input id="search" type="search" placeholder="Date, sport or activity ID"></label><div id="activities"></div></aside><div class="track-map"><p id="track-status" class="status" role="status">Select an activity.</p><div id="map" class="map" aria-label="Selected activity route"></div></div></div></section>
</main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/app.js" defer></script></body></html>
